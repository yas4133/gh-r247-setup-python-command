name: setup-python pull request metadata consumer

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request files as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Resolve requested Python from project metadata
        id: setup
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: pyproject.toml
      - name: Trusted consumer invokes documented interpreter output
        env:
          PYTHON_FROM_ACTION: ${{ steps.setup.outputs.python-path }}
        run: |
          "$PYTHON_FROM_ACTION" -c 'print("trusted interpreter executed")'
