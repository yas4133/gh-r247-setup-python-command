name: setup-python workflow-command canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Parse attacker-controlled TOML version metadata
        id: setup
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: pyproject.toml
      - name: Consume documented python-path output
        env:
          OBSERVED_PYTHON_PATH: ${{ steps.setup.outputs.python-path }}
        run: |
          printf 'OUTPUT_START=%s\n' "$OBSERVED_PYTHON_PATH"
          "$OBSERVED_PYTHON_PATH"
          test "$(cat GH_R247_EXECUTED)" = owned-canary
      - name: Clean invalid-TOML sibling
        id: clean
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: clean.toml
      - name: Verify clean sibling exposes no executable
        env:
          CLEAN_PYTHON_PATH: ${{ steps.clean.outputs.python-path }}
        run: |
          printf 'CLEAN_OUTPUT=%s\n' "$CLEAN_PYTHON_PATH"
          test -z "$CLEAN_PYTHON_PATH"
